<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غرفة مقفولة</title>
<meta name="description" content="غرفة خاصة بشخصين، مشفّرة من طرف لطرف.">
<meta name="theme-color" content="#000000">
<link rel="icon" id="fav" href="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --g:#2fe0b4; --g2:#0fa383; --glow:rgba(47,224,180,.22);
  --bg:#000; --bg2:#0b0b0d; --card:#111114; --line:rgba(255,255,255,.09);
  --txt:#f5f5f7; --mut:#86868b; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang=ar] body,html[lang=ur] body{font-family:"IBM Plex Sans Arabic","SF Arabic",-apple-system,system-ui,sans-serif;line-height:1.75}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--g);outline-offset:3px;border-radius:8px}
img{display:block;max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.g{color:var(--g)}
.grad{background:linear-gradient(120deg,#fff 10%,var(--g) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}

/* progress + nav */
#bar{position:fixed;top:0;inset-inline-start:0;height:2px;width:100%;background:var(--g);transform-origin:left;transform:scaleX(0);z-index:100}
html[dir=rtl] #bar{transform-origin:right}
nav.top{position:fixed;top:0;inset-inline:0;z-index:50;height:52px;backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);background:rgba(0,0,0,.62);border-bottom:1px solid var(--line);transition:background .3s}
nav.top .in{max-width:1080px;margin:0 auto;height:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.brand img{width:26px;height:26px}
.links{display:flex;align-items:center;gap:26px;font-size:13px;color:#d2d2d7}
.links a{opacity:.8;transition:opacity .2s}.links a:hover{opacity:1}
.right{display:flex;align-items:center;gap:12px}
.pill{background:var(--g);color:#012a20;font-weight:600;font-size:13px;padding:6px 16px;border-radius:999px;transition:transform .2s var(--ease),filter .2s}
.pill:hover{transform:scale(1.05);filter:brightness(1.1)}
.lang{position:relative}
.lang button.cur{display:flex;align-items:center;gap:6px;font-size:13px;color:#d2d2d7;padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.lang ul{position:absolute;top:calc(100% + 8px);inset-inline-end:0;list-style:none;background:rgba(28,28,30,.96);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:150px;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.97);transition:all .22s var(--ease)}
.lang.open ul{opacity:1;visibility:visible;transform:none}
.lang li button{width:100%;text-align:start;padding:9px 12px;border-radius:9px;font-size:14px}
.lang li button:hover,.lang li button[aria-current=true]{background:rgba(255,255,255,.1)}
@media(max-width:820px){.links{display:none}}

/* reveal */
.rv{opacity:0;transform:translateY(40px) scale(.98);filter:blur(8px);transition:opacity 1s var(--ease),transform 1s var(--ease),filter 1s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none;filter:none}

/* hero */
.hero{position:relative;padding:150px 0 40px;text-align:center;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;will-change:transform}
.orb.a{width:520px;height:520px;background:var(--glow);top:-120px;inset-inline-start:8%;animation:drift 14s ease-in-out infinite}
.orb.b{width:420px;height:420px;background:rgba(80,120,255,.14);top:80px;inset-inline-end:6%;animation:drift 18s ease-in-out infinite reverse}
@keyframes drift{0%,100%{translate:0 0}50%{translate:40px 30px}}
.hero .logo{width:92px;height:92px;margin:0 auto 22px;animation:pop 1.2s var(--ease) both,bob 6s ease-in-out 1.2s infinite;filter:drop-shadow(0 20px 40px var(--glow))}
@keyframes pop{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-8px)}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:5px 14px;background:rgba(255,255,255,.03)}
.eyebrow svg{color:var(--g)}
h1{font-size:clamp(42px,8vw,92px);line-height:1.08;font-weight:700;letter-spacing:-.025em;margin-top:22px}
html[lang=ar] h1,html[lang=ur] h1{letter-spacing:0;line-height:1.2}
h1 .w{display:inline-block;opacity:0;transform:translateY(40px);filter:blur(12px);animation:wIn 1s var(--ease) forwards;animation-delay:calc(.25s + var(--i)*.09s)}
@keyframes wIn{to{opacity:1;transform:none;filter:none}}
.sub{max-width:640px;margin:24px auto 0;font-size:clamp(17px,2.2vw,21px);color:var(--mut)}
.cta{margin-top:34px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:17px;padding:14px 28px;border-radius:999px;transition:transform .25s var(--ease),filter .2s,background .2s}
.btn.p{background:var(--g);color:#012a20}
.btn.s{background:rgba(255,255,255,.08);border:1px solid var(--line)}
.btn:hover{transform:scale(1.045)}.btn.p:hover{filter:brightness(1.1)}.btn.s:hover{background:rgba(255,255,255,.14)}
.chips{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center;color:var(--mut);font-size:14px}
.chips span{display:flex;align-items:center;gap:7px}.chips svg{color:var(--g)}

/* phone */
.stage{position:relative;margin-top:70px;display:flex;justify-content:center;perspective:1400px}
.phone{width:320px;height:640px;border-radius:52px;padding:11px;background:linear-gradient(145deg,#2c2c30,#0e0e10);box-shadow:0 0 0 1.5px #3a3a3f,0 60px 120px rgba(0,0,0,.8),0 0 120px var(--glow);transform:rotateX(var(--rx,14deg)) scale(var(--sc,.92));transition:transform .15s linear;position:relative;direction:ltr}
.phone:before{content:"";position:absolute;top:20px;left:50%;translate:-50% 0;width:96px;height:26px;border-radius:20px;background:#000;z-index:3}
.scr{height:100%;border-radius:42px;background:#050507;overflow:hidden;display:flex;flex-direction:column;position:relative}
.scr:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.05) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 7s ease-in-out infinite;pointer-events:none}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.ph-h{padding:52px 18px 12px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--line)}
.ph-h img{width:30px;height:30px}
.ph-h b{font-size:14px;display:block}.ph-h small{font-size:11px;color:var(--g)}
.msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end;background:radial-gradient(300px 220px at 100% 0,var(--glow),transparent 70%)}
.m{max-width:80%;padding:9px 14px;border-radius:18px;font-size:13.5px;line-height:1.55;opacity:0;transform:translateY(14px) scale(.9);transition:all .5s var(--ease)}
.m.show{opacity:1;transform:none}
.m.me{align-self:flex-end;background:linear-gradient(135deg,var(--g2),#0b6a57);border-end-end-radius:4px;color:#fff}
.m.you{align-self:flex-start;background:#1c1c20;border-end-start-radius:4px}
html[dir=rtl] .m.me{align-self:flex-start}html[dir=rtl] .m.you{align-self:flex-end}
.typing{align-self:flex-start;display:none;gap:4px;padding:12px 14px;background:#1c1c20;border-radius:18px}
.typing.show{display:flex}
.typing i{width:6px;height:6px;border-radius:50%;background:#8a8a90;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{transform:translateY(-5px);background:var(--g)}}
.voice{display:flex;align-items:center;gap:10px}
.wave{display:flex;align-items:center;gap:3px;height:24px}
.wave i{width:3px;border-radius:2px;background:#fff9;animation:wv 1s ease-in-out infinite}
@keyframes wv{50%{transform:scaleY(.35)}}
.lockline{text-align:center;font-size:11px;color:var(--g);border:1px solid rgba(47,224,180,.4);border-radius:999px;padding:4px 12px;align-self:center;display:flex;gap:6px;align-items:center}
.ph-f{padding:12px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);background:rgba(255,255,255,.03)}
.ph-f div{flex:1;background:#0c0c0f;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:12.5px;color:#6e6e73}
.ph-f b{width:34px;height:34px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#012a20}
.float{position:absolute;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;background:rgba(28,28,30,.75);backdrop-filter:blur(20px);border:1px solid var(--line);font-size:13px;font-weight:500;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:fl 5s ease-in-out infinite}
.float svg{color:var(--g)}
.float.f1{top:90px;inset-inline-start:calc(50% - 360px)}
.float.f2{top:300px;inset-inline-end:calc(50% - 370px);animation-delay:-2s}
.float.f3{bottom:90px;inset-inline-start:calc(50% - 330px);animation-delay:-3.5s}
@keyframes fl{50%{transform:translateY(-14px)}}
@media(max-width:900px){.float{display:none}}

/* marquee */
.mq{margin-top:90px;overflow:hidden;border-block:1px solid var(--line);padding:18px 0;mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.mq .tr{display:flex;gap:46px;width:max-content;animation:mq 38s linear infinite;direction:ltr}
.mq span{white-space:nowrap;font-size:22px;font-weight:600;color:#3a3a3f;display:flex;align-items:center;gap:46px}
.mq span:after{content:"•";color:var(--g);opacity:.6}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
section{padding:130px 0}
.head{text-align:center;max-width:760px;margin:0 auto 70px}
.kick{color:var(--g);font-weight:600;font-size:17px}
h2{font-size:clamp(34px,5.6vw,64px);line-height:1.1;letter-spacing:-.02em;font-weight:700;margin-top:10px}
html[lang=ar] h2,html[lang=ur] h2{letter-spacing:0;line-height:1.25}
.lead{margin-top:18px;color:var(--mut);font-size:clamp(17px,2vw,21px)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:34px;overflow:hidden;min-height:260px;transition:transform .5s var(--ease),border-color .3s}
.card:hover{transform:translateY(-6px);border-color:rgba(47,224,180,.4)}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none}
.card:hover:before{opacity:1}
.card.w3{grid-column:span 3}.card.w2{grid-column:span 2}.card.w4{grid-column:span 4}
.ico{width:54px;height:54px;border-radius:16px;background:var(--glow);display:grid;place-items:center;color:var(--g)}
.card h3{font-size:24px;font-weight:600;margin-top:22px;letter-spacing:-.01em}
.card p{margin-top:10px;color:var(--mut);font-size:16px}
.viz{margin-top:22px;height:64px;display:flex;align-items:center;gap:5px}
.viz i{flex:1;max-width:5px;border-radius:3px;background:var(--g);animation:wv 1.2s ease-in-out infinite}
.dice{display:flex;gap:10px;margin-top:22px}
.dice b{width:46px;height:46px;border-radius:12px;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;animation:roll 3s var(--ease) infinite}
.dice b:nth-child(2){animation-delay:.3s}
.dice b i{width:7px;height:7px;border-radius:50%;background:#111;place-self:center}
@keyframes roll{0%,70%,100%{transform:rotate(0)}85%{transform:rotate(180deg) translateY(-6px)}}
.eye{margin-top:22px;width:100%;height:64px;border-radius:14px;border:1px dashed rgba(255,255,255,.2);display:grid;place-items:center;color:var(--mut);font-size:13px;animation:vanish 4s ease-in-out infinite}
@keyframes vanish{0%,55%{opacity:1;filter:none}80%,100%{opacity:0;filter:blur(10px)}}
@media(max-width:860px){.bento{grid-template-columns:1fr}.card.w2,.card.w3,.card.w4{grid-column:auto}}

/* security */
.sec{background:linear-gradient(180deg,#000,#071311 50%,#000)}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.lst{list-style:none;display:flex;flex-direction:column;gap:20px;margin-top:30px}
.lst li{display:flex;gap:14px;color:var(--mut);font-size:17px}
.lst li svg{flex-shrink:0;color:var(--g);margin-top:5px}
.lst strong{color:var(--txt);font-weight:600}
.pipe{display:flex;flex-direction:column;gap:12px;direction:ltr}
.node{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 24px;transition:border-color .6s,box-shadow .6s}
.node small{display:block;color:var(--mut);font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.node div{font-size:19px;font-weight:500;word-break:break-all;min-height:30px}
.node.srv div{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:#6e8f87}
.node.act{border-color:var(--g);box-shadow:0 0 50px var(--glow)}
.arrow{align-self:center;display:flex;align-items:center;gap:8px;color:var(--g);font-size:13px;font-weight:600}
.arrow svg{animation:dn 1.6s ease-in-out infinite}
@keyframes dn{50%{transform:translateY(5px)}}
.note{margin-top:28px;text-align:center;color:#6e6e73;font-size:14px}
@media(max-width:860px){.flow{grid-template-columns:1fr}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:36px}
.step .n{font-size:84px;font-weight:700;line-height:1;background:linear-gradient(180deg,var(--g),transparent 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.step h3{font-size:24px;margin-top:10px;font-weight:600}
.step p{margin-top:10px;color:var(--mut)}
@media(max-width:860px){.steps{grid-template-columns:1fr}}

/* themes */
.themes{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:10px}
.sw{width:64px;height:64px;border-radius:50%;border:3px solid transparent;padding:4px;transition:transform .35s var(--ease),border-color .3s}
.sw i{display:block;width:100%;height:100%;border-radius:50%}
.sw:hover{transform:scale(1.15)}.sw[aria-pressed=true]{border-color:#fff;transform:scale(1.12)}

/* faq */
.faq{max-width:760px;margin:0 auto;display:flex;flex-direction:column}
.q{border-bottom:1px solid var(--line)}
.q button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:start;padding:24px 4px;font-size:20px;font-weight:600}
.q .pm{width:26px;height:26px;position:relative;flex-shrink:0;color:var(--g)}
.q .pm:before,.q .pm:after{content:"";position:absolute;top:50%;left:50%;width:16px;height:2px;background:currentColor;translate:-50% -50%;transition:transform .4s var(--ease)}
.q .pm:after{transform:rotate(90deg)}
.q.open .pm:after{transform:rotate(0)}
.q .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.q.open .a{grid-template-rows:1fr}
.q .a>div{overflow:hidden}
.q .a p{padding:0 4px 24px;color:var(--mut);font-size:17px}

/* download */
.dl{position:relative;border-radius:44px;padding:clamp(48px,8vw,100px) 24px;text-align:center;overflow:hidden;background:radial-gradient(800px 400px at 50% 0,var(--glow),transparent 70%),var(--bg2);border:1px solid var(--line)}
.dl img{width:96px;margin:0 auto;animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 20px 40px var(--glow))}
.dl h2{margin-top:20px}
.dl .lead{max-width:520px;margin-inline:auto}
.dl .cta{margin-top:34px}
footer{border-top:1px solid var(--line);padding:34px 0;color:var(--mut);font-size:13px}
footer .in{max-width:1080px;margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
footer nav{display:flex;gap:22px;flex-wrap:wrap}footer a:hover{color:var(--txt)}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rv{opacity:1;transform:none;filter:none}h1 .w{opacity:1;transform:none;filter:none}
}
</style>
</head>
<body>
<div id="bar"></div>

<nav class="top"><div class="in">
  <a class="brand" href="#top"><img class="lg" alt=""><span data-i18n="brand"></span></a>
  <div class="links">
    <a href="#features" data-i18n="nav_features"></a>
    <a href="#security" data-i18n="nav_security"></a>
    <a href="#how" data-i18n="nav_how"></a>
    <a href="#faq" data-i18n="nav_faq"></a>
  </div>
  <div class="right">
    <div class="lang" id="lang">
      <button class="cur" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
        <span id="langName"></span>
      </button>
      <ul id="langList"></ul>
    </div>
    <a class="pill" href="#download" data-i18n="nav_dl"></a>
  </div>
</div></nav>

<header class="hero" id="top">
  <div class="orb a" data-par="0.15"></div><div class="orb b" data-par="-0.1"></div>
  <div class="wrap">
    <img class="logo lg" alt="" width="92" height="92">
    <div class="eyebrow rv"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span data-i18n="badge"></span></div>
    <h1 id="h1"></h1>
    <p class="sub rv" style="--d:.5s" data-i18n="sub"></p>
    <div class="cta rv" style="--d:.65s">
      <a class="btn p" href="https://locked-room.mm284817.workers.dev/locked-room.apk" download>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
        <span data-i18n="dl_android"></span>
      </a>
      <a class="btn s" href="https://locked-room.mm284817.workers.dev" target="_blank" rel="noopener" data-i18n="web"></a>
    </div>
    <ul class="chips rv" style="--d:.8s;list-style:none">
      <li><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg><span data-i18n="chip1"></span></span></li>
      <li><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg><span data-i18n="chip2"></span></span></li>
      <li><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg><span data-i18n="chip3"></span></span></li>
    </ul>

s_kick:'Sécurité',s_title:'Même nous ne pouvons pas lire vos messages.',s_sub:'Chaque message, photo et fichier est chiffré sur votre appareil avant de partir ; le serveur ne reçoit qu\'un texte chiffré sans sens. La clé n\'est envoyée nulle part.',
s1:'<strong>AES-256-GCM</strong> chiffre tout le contenu de la salle, y compris noms et types de fichiers.',
s2:'<strong>Une clé en deux parties :</strong> le code de la salle et son mot de passe, dérivée sur votre appareil uniquement.',

h3t:'Entrez et parlez',h3d:'Dès que vous êtes deux, la salle s\'anime. Elle n\'accueille pas plus de deux personnes.',

q_kick:'FAQ',q_title:'Réponses rapides.',
faq:[['Quelqu\'un peut-il lire nos messages ?','Non. Les messages sont chiffrés sur votre appareil avec une clé dérivée du code et du mot de passe de la salle. Le serveur ne détient jamais la clé.'],['Et si j\'oublie le mot de passe de la salle ?','Le mot de passe fait partie de la clé : il est impossible de le récupérer, ainsi que les messages. Conservez-le et convenez-en avec l\'autre personne.'],['Combien de personnes dans une salle ?','Deux seulement. La salle est conçue pour une conversation privée à deux ; une troisième personne ne peut pas entrer.'],['Les appels sont-ils chiffrés aussi ?','Oui. Audio et vidéo passent entre les deux appareils avec le chiffrement WebRTC, et la configuration de l\'appel transite chiffrée par la clé de la salle.'],['Sur quels appareils ça marche ?','Dans le navigateur sur mobile et ordinateur, plus une application Android. Retrouvez vos salles sur un nouvel appareil avec votre compte et mot de passe.']],

faq:[['¿Puede alguien leer nuestros mensajes?','No. Los mensajes se cifran en tu dispositivo con una clave derivada del código y la contraseña de la sala. El servidor nunca guarda la clave.'],['¿Y si olvido la contraseña de la sala?','La contraseña forma parte de la clave, por lo que no se puede recuperar ni tampoco los mensajes. Guárdala y acordadla con la otra persona.'],['¿Cuántas personas caben en una sala?','Solo dos. La sala está pensada para una conversación privada entre dos; una tercera persona no puede unirse.'],['¿Las llamadas también están cifradas?','Sí. Audio y vídeo viajan entre los dos dispositivos con cifrado WebRTC, y los datos de la llamada pasan cifrados con la clave de la sala.'],['¿En qué dispositivos funciona?','En el navegador del móvil y el ordenador, y hay una app para Android. Entra a tus salas desde un dispositivo nuevo con tu cuenta y contraseña.']],

faq:[['Mesajlarımızı başkası okuyabilir mi?','Hayır. Mesajlar cihazınızda, oda kodu ve parolasından türetilen anahtarla şifrelenir. Sunucu anahtarı hiç tutmaz.'],['Oda parolasını unutursam?','Parola anahtarın bir parçasıdır; geri alınamaz, mesajlar da onsuz kurtarılamaz. Saklayın ve karşı tarafla kararlaştırın.'],['Odaya kaç kişi girebilir?','Yalnızca iki kişi. Oda iki kişilik özel bir konuşma için tasarlandı; üçüncü kişi katılamaz.'],['Aramalar da şifreli mi?','Evet. Ses ve görüntü iki cihaz arasında WebRTC şifrelemesiyle akar; arama kurulum verisi oda anahtarıyla şifreli geçer.'],['Hangi cihazlarda çalışır?','Mobil ve bilgisayar tarayıcılarında, ayrıca Android uygulaması var. Yeni bir cihazdan hesabınız ve parolanızla odalarınıza girebilirsiniz.']],

badge:'Ende-zu-Ende-verschlüsselt. Alles.',h1a:'Ein privater Raum für zwei.',h1b:'Nur mit eurem Schlüssel verschlossen.',
sub:'Chat, Sprach- und Videoanrufe, Fotos, Dateien, Musik und Spiele in einem Raum, den niemand sonst betritt. Der Schlüssel entsteht auf euren beiden Geräten, nicht einmal der Server kann den Inhalt lesen.',
dl_android:'Für Android laden',web:'Im Web öffnen',chip1:'Nur zwei Personen pro Raum',chip2:'Keine Telefonnummern',chip3:'Mobil und Web',
fl1:'AES-256-verschlüsselt',fl2:'Videoanruf',fl3:'Gemeinsam hören',room:'Unser Raum',online:'Online · Verschlüsselt',m1:'Ist der Code angekommen?',m2:'Ja, ich habe den Raum gerade geöffnet.',m3:'Super. Ruf mich per Video an.',e2e:'Nachrichten sind Ende-zu-Ende-verschlüsselt',typeMsg:'Nachricht',
mq:['Sofort-Chat','Videoanrufe','Sprachnachrichten','Verschwindende Fotos','Gemeinsame Musik','Ludo-Spiel','AES-256-Verschlüsselung','Keine Telefonnummer'],
f_kick:'Funktionen',f_title:'Alles zum Verbinden. An einem Ort.',f_sub:'Schluss mit dem App-Wechsel. Euer Raum vereint Chat, Anrufe und Spaß.',
f1t:'Sofort-Chat',f1d:'Antworten, Bearbeiten und Emoji-Reaktionen, mit Zustellungs- und Lesebestätigung.',
f2t:'Sprach- & Videoanrufe',f2d:'Ein direkter Anruf zwischen euren Geräten, der auch bei gesperrtem Display oder verlassenem Chat weiterläuft.',
f3t:'Sprachnachrichten',f3d:'Mit einem Tipp aufnehmen und senden, mit Wellenform und Hör-Anzeige.',
f4t:'Einmal ansehen',f4d:'Foto oder Video mit Beschriftung senden, einmal anzeigen, dann verschwindet es.',f4v:'Nur einmal sichtbar',
f5t:'Gemeinsam Musik hören',f5d:'Spiel einen Titel ab und der andere hört ihn im selben Moment, mit gemeinsamer Pause und Vorspulen.',
f6t:'Spiele & Anklopfen',f6d:'Spielt Ludo im Raum und schickt ein „Klopfen“ an die Tür, um sanft Bescheid zu geben.',
f_more:'Außerdem: Dateien und Dokumente senden, auf Arabisch und Englisch.',
s_kick:'Sicherheit',s_title:'Selbst wir können eure Nachrichten nicht lesen.',s_sub:'Jede Nachricht, jedes Foto und jede Datei wird auf deinem Gerät verschlüsselt, bevor sie es verlässt. Der Server erhält nur sinnlosen Geheimtext. Der Schlüssel wird nirgends hingeschickt.',
s1:'<strong>AES-256-GCM</strong> verschlüsselt alle Inhalte im Raum, auch Dateinamen und -typen.',
s2:'<strong>Ein zweiteiliger Schlüssel:</strong> Raumcode und Passwort, nur auf deinem Gerät abgeleitet.',
s3:'<strong>Verschlüsselte Anrufe:</strong> Audio und Video laufen direkt zwischen den Geräten mit WebRTC-Verschlüsselung, der Verbindungsaufbau ist mit dem Raumschlüssel verschlüsselt.',
s4:'<strong>Ein privater Tresor</strong>, mit dem Passwort deines Kontos verschlüsselt. Niemand sonst kann ihn lesen.',
s_dev:'Auf deinem Gerät',s_srv:'Was der Server sieht',s_other:'Auf dem Gerät des anderen',s_enc:'Hier verschlüsselt',s_dec:'Nur hier entschlüsselt',
s_plain:'Wir treffen uns um sieben',s_note:'Der Server sieht nur Zustelldaten wie die Verbindungszeit, da sie für die Auslieferung nötig sind.',
h_kick:'Loslegen',h_title:'Drei Schritte zu eurem Raum.',
h1t:'Raum erstellen',h1d:'Anmelden, „Neuer Raum“ wählen und ein Passwort setzen. Du erhältst einen 24-stelligen Code.',
h2t:'Link teilen',h2d:'Sende Code oder Link an wen du willst und einigt euch außerhalb der App auf das Passwort.',
h3t:'Eintreten und reden',h3d:'Sobald ihr beide drin seid, erwacht der Raum. Er fasst nicht mehr als zwei Personen.',
t_kick:'Erscheinungsbild',t_title:'Fünf Farben. Ganz nach Geschmack.',t_sub:'Tippe auf eine Farbe und sieh, wie sich die ganze Seite ändert, genau wie in der App.',
q_kick:'FAQ',q_title:'Schnelle Antworten.',
faq:[['Kann jemand unsere Nachrichten lesen?','Nein. Nachrichten werden auf deinem Gerät mit einem aus Raumcode und Passwort abgeleiteten Schlüssel verschlüsselt. Der Server speichert den Schlüssel nie.'],['Was, wenn ich das Raumpasswort vergesse?','Das Passwort ist Teil des Schlüssels, es lässt sich nicht wiederherstellen, die Nachrichten ebenso wenig. Bewahre es sicher auf.'],['Wie viele Personen passen in einen Raum?','Nur zwei. Der Raum ist für ein privates Gespräch zu zweit gedacht; eine dritte Person kann nicht beitreten.'],['Sind Anrufe auch verschlüsselt?','Ja. Audio und Video laufen zwischen beiden Geräten mit WebRTC-Verschlüsselung, die Verbindungsdaten passen verschlüsselt mit dem Raumschlüssel durch.'],['Auf welchen Geräten funktioniert es?','Im Browser auf Handy und Computer, dazu gibt es eine Android-App. Mit Konto und Passwort kommst du von einem neuen Gerät in deine Räume.']],
c_title:'Öffne jetzt deinen Raum.',c_sub:'Keine Telefonnummern, kein Aufwand. Wähle deinen Weg zum Start.',
themes:['Türkis','Pink','Violett','Orange','Blau']},

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

let lang='en',themeIdx=0,faqOpen=-1;

function detect(){
  try{const s=localStorage.getItem('lr_lang');if(s&&T[s])return s}catch(e){}
  for(const l of (navigator.languages||[navigator.language||'en'])){
    const c=String(l).toLowerCase().split('-')[0];if(T[c])return c}
  return 'en';
}

function buildFaq(){
  const L=T[lang];
  $('#faqList').innerHTML=L.faq.map((x,i)=>`<div class="q${faqOpen===i?' open':''}"><button type="button" aria-expanded="${faqOpen===i}" data-i="${i}"><span>${x[0]}</span><span class="pm" aria-hidden="true"></span></button><div class="a"><div><p>${x[1]}</p></div></div></div>`).join('');
}
function buildThemes(){
  $('#themes').innerHTML=THEMES.map((t,i)=>`<button type="button" class="sw" data-i="${i}" aria-label="${T[lang].themes[i]}" aria-pressed="${i===themeIdx}"><i style="background:linear-gradient(135deg,${t.g},${t.g2})"></i></button>`).join('');
}
function buildH1(){
  const L=T[lang];let i=0;
  const words=(s,cls)=>s.split(' ').map(w=>`<span class="w ${cls}" style="--i:${i++}">${w}</span>`).join(' ');
  $('#h1').innerHTML=words(L.h1a,'')+'<br>'+'<span class="grad">'+words(L.h1b,'')+'</span>';
}
function buildMq(){
  const items=T[lang].mq.map(x=>`<span>${x}</span>`).join('');
  $('#mq').innerHTML=items+items+items+items;
}
function applyLang(l,save){
  lang=l;const L=T[l];
  document.documentElement.lang=l;document.documentElement.dir=RTL.includes(l)?'rtl':'ltr';
  document.title=L.brand+' — '+L.h1a+' '+L.h1b;
  $('meta[name=description]').content=L.sub;
  $$('[data-i18n]').forEach(e=>{const v=L[e.dataset.i18n];if(v!=null)e.textContent=v});
  $$('[data-i18n-html]').forEach(e=>{const v=L[e.dataset.i18nHtml];if(v!=null)e.innerHTML=v});
  $('#langName').textContent=LANGS[l];
  $$('#langList button').forEach(b=>b.setAttribute('aria-current',b.dataset.l===l));
  buildH1();buildMq();buildFaq();buildThemes();restartDemo();

}

/* scroll-driven: progress bar, phone tilt, parallax */
const bar=$('#bar'),phone=$('#phone'),stage=$('#stage');
let tick=false;
function onScroll(){
  if(tick)return;tick=true;requestAnimationFrame(()=>{
    const y=scrollY,h=document.documentElement.scrollHeight-innerHeight;
    bar.style.transform=`scaleX(${h>0?y/h:0})`;
    if(!reduce){
      const r=stage.getBoundingClientRect(),p=Math.min(1,Math.max(0,1-(r.top-innerHeight*.15)/(innerHeight*.7)));
      phone.style.setProperty('--rx',(14*(1-p))+'deg');phone.style.setProperty('--sc',(.92+.08*p));
      $$('[data-par]').forEach(o=>o.style.transform=`translateY(${y*o.dataset.par}px)`);
    }
    tick=false});
}
addEventListener('scroll',onScroll,{passive:true});onScroll();

/* chat demo loop */
let demoT=[];
function restartDemo(){
  demoT.forEach(clearTimeout);demoT=[];
  const ms=$$('#msgs .m'),ty=$('#typing');ms.forEach(m=>m.classList.remove('show'));ty.classList.remove('show');
  if(reduce){ms.forEach(m=>m.classList.add('show'));return}
  let t=700;
  ms.forEach((m,i)=>{
    const me=m.classList.contains('me');
    if(!me){demoT.push(setTimeout(()=>ty.classList.add('show'),t-500))}
    demoT.push(setTimeout(()=>{ty.classList.remove('show');m.classList.add('show')},t));
    t+=1500;
  });
  demoT.push(setTimeout(restartDemo,t+3500));
}

/* encryption scramble */
const CH='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';
let encRun=0;
function scramble(el,from,to,dur){return new Promise(res=>{
  const t0=performance.now(),run=encRun;
  (function f(now){
    if(run!==encRun)return res();
    const p=Math.min(1,(now-t0)/dur),n=Math.max(from.length,to.length);let s='';
    for(let i=0;i<n;i++){
      if(i<to.length&&i/n<p)s+=to[i];
      else s+=CH[Math.random()*CH.length|0];
    }
    el.textContent=s.slice(0,Math.round(from.length+(to.length-from.length)*p));
    if(p<1)requestAnimationFrame(f);else{el.textContent=to;res()}
  })(t0)})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function fakeCipher(len){let s='';for(let i=0;i<len;i++)s+=CH[Math.random()*CH.length|0];return s}
async function encLoop(){
  const run=++encRun,n1=$('#n1'),n2=$('#n2'),n3=$('#n3'),p=$('#plain'),c=$('#cipher'),o=$('#out');
  const txt=T[lang].s_plain;
  if(reduce){p.textContent=txt;c.textContent=fakeCipher(44);o.textContent=txt;return}
  while(run===encRun){
    p.textContent='';c.textContent='';o.textContent='';[n1,n2,n3].forEach(n=>n.classList.remove('act'));
    n1.classList.add('act');
    for(let i=1;i<=txt.length&&run===encRun;i++){p.textContent=txt.slice(0,i);await sleep(55)}
    await sleep(500);if(run!==encRun)return;
    n1.classList.remove('act');n2.classList.add('act');
    await scramble(c,'',fakeCipher(44),1100);await sleep(600);if(run!==encRun)return;
    n2.classList.remove('act');n3.classList.add('act');
    await scramble(o,fakeCipher(txt.length),txt,1100);
    await sleep(3200);
  }
}
const eio=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){encLoop()}else{encRun++}})},{threshold:.3});
eio.observe($('#pipe'));
const _apply=applyLang;
